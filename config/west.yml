manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: kumamuk-git
      url-base: https://github.com/kumamuk-git
    # 1. 여기에 urob 원격 저장소를 추가합니다.
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3-branch
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: kumamuk-git
      revision: main
    # 2. 여기에 가속도 기능을 담당하는 모듈을 추가합니다.
    - name: zmk-input-behavior-listener
      remote: urob
      revision: main

  self:
    path: config
