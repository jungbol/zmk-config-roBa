name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            modules
            zephyr
            bootloader
            zmk
          key: ${{ runner.os }}-build-${{ hashFiles('**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install West
        run: pip3 install west

      - name: West Init
        run: west init -l config

      # 🔥 이 부분이 핵심입니다: 인증 에러 방지 설정
      - name: Configure Git for Private/External Modules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: West Update
        run: west update

      - name: West Zephyr Export
        run: west zephyr-export

      - name: Prepare variables
        id: variables
        run: |
          if [ -n "${{ github.event.inputs.shield }}" ]; then
            SHIELD="${{ github.event.inputs.shield }}"
          else
            SHIELD="roBa_R"
          fi
          echo "shield=$SHIELD" >> $GITHUB_OUTPUT
          echo "board=seeeduino_xiao_ble" >> $GITHUB_OUTPUT

      - name: Build ZMK
        run: |
          west build -s zmk/app -b ${{ steps.variables.outputs.board }} -- -DSHIELD=${{ steps.variables.outputs.shield }} -DZMK_CONFIG=${{ github.workspace }}/config

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zmk-firmware
          path: build/zephyr/zmk.uf2
